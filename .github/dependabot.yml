# Dependabot: actualizaciones de las dependencias de Gradle y de las acciones de los workflows (y, con las alertas
# activadas en Settings › Security, avisos de vulnerabilidades con su PR de arreglo). Cada PR pasa por «Compilar» y «Seguridad».
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    labels: [dependencias]
    groups:
      androidx:
        patterns: ['androidx.*']
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    commit-message:
      prefix: 'ci'
    labels: [dependencias]
    groups:
      acciones:
        patterns: ['*']
